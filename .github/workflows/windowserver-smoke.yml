name: azooKey WindowServer GUI smoke test

# Intentionally scoped to an owner push on the diagnostics branch.
# No pull_request, issues, or external-contributor event may run on a self-hosted Mac.
on:
  push:
    branches:
      - diagnostics/window-lifecycle-348
    paths:
      - .github/workflows/windowserver-smoke.yml

permissions:
  contents: read

jobs:
  macos-gui-smoke:
    if: github.repository == 'Amatubamem/azooKey-Desktop' && github.actor == 'Amatubamem'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 12
    steps:
      - name: Inspect runner
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner: %s\nOS: %s\nUser: %s\n' "$RUNNER_NAME" "$RUNNER_OS" "$(id -un)"
          sw_vers -productVersion
          printf 'azooKey PID: '
          pgrep -x azooKeyMac || true
          printf 'WindowServer PID: '
          pgrep -x WindowServer || true

      - name: Checkout diagnostics branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n Tools/windowserver-benchmark.sh
          echo 'Bash syntax: PASS'

      - name: Probe macOS input source and window visibility
        shell: bash
        run: |
          set -euo pipefail
          echo "Console owner: $(stat -f '%Su' /dev/console)"
          echo "WindowServer and azooKey processes:"
          ps -axo pid,ppid,user,stat,comm | grep -E 'WindowServer|azooKeyMac|Google Chrome' | head -n 24 || true
          echo "Chrome window count:"
          osascript -e 'tell application "Google Chrome" to count windows' || true
          echo "Frontmost app via System Events:"
          osascript -e 'tell application "System Events" to get name of first application process whose frontmost is true' || true
          echo "CoreGraphics global window list:"
          swift -e 'import CoreGraphics; import Foundation; let w = (CGWindowListCopyWindowInfo(.optionAll, kCGNullWindowID) as? [[String: Any]]) ?? []; print("total_window_count=\(w.count)"); let owners = Dictionary(grouping: w, by: { ($0[kCGWindowOwnerName as String] as? String) ?? "unknown" }); for (name, windows) in owners.sorted(by: { $0.value.count > $1.value.count }).prefix(12) { print("\(name): \(windows.count)") }' || true
          echo "Selected input source:"
          swift -e 'import Carbon; if let source = TISCopyCurrentKeyboardInputSource()?.takeRetainedValue(), let raw = TISGetInputSourceProperty(source, kTISPropertyInputSourceID) { print(Unmanaged<CFString>.fromOpaque(raw).takeUnretainedValue()) }' || true

      - name: Verify screen-capture and Accessibility access
        shell: bash
        run: |
          set -euo pipefail
          swift -e '
          import CoreGraphics
          import ApplicationServices
          import Foundation
          print("screen_recording_preflight=\(CGPreflightScreenCaptureAccess())")
          print("accessibility_preflight=\(AXIsProcessTrusted())")
          let windowList = CGWindowListCopyWindowInfo(.optionAll, kCGNullWindowID)
          if let list = windowList as? [[String: Any]] {
            print("cg_window_list_nil=false")
            print("cg_total_windows=\(list.count)")
            if list.count == 0 {
              fputs("CGWindowListCopyWindowInfo returned zero windows. GUI benchmark cannot validate session creation.\\n", stderr)
              exit(2)
            }
          } else {
            print("cg_window_list_nil=true")
            fputs("CGWindowListCopyWindowInfo returned nil. GUI benchmark cannot run.\\n", stderr)
            exit(2)
          }
          '

      - name: Exercise real Chrome input focus and measure WindowServer
        shell: bash
        env:
          SETTLE_SECONDS: '5'
          DURATION_SECONDS: '6'
          TAB_STEPS: '1 2'
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          bash Tools/windowserver-benchmark.sh

      - name: Upload measurement data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windowserver-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/azookey-windowserver.*/**
          if-no-files-found: warn
          retention-days: 3
